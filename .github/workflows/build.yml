- name: Find APK and copy to root
        run: |
          APK=$(find . -name "*.apk" -type f | head -n 1)
          echo "Найден файл: $APK"
          cp "$APK" ./FINAL_APP.apk
          ls -lh ./FINAL_APP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tir-app
          path: ./FINAL_APP.apk
          if-no-files-found: error