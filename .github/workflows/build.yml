name: Build APK and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 🔧 GTK для Flet
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      
      # 📱 Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      
      - name: Install flet
        run: pip install flet==0.24.1 requests beautifulsoup4 lxml
      
      # 🔨 Сборка
      - name: Build APK
        run: flet build apk
      
      - name: Find APK
        id: find
        run: |
          APK=$(find build -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -lh $APK
      
      # 🗑️ Удаляем старые релизы
      - name: Delete old releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            for (const release of releases.data) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              console.log(`🗑️ Удалён: ${release.tag_name}`);
            }
      
      # 🆕 Новый релиз
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.apk }}
          tag_name: v16.3
          name: Tir Browser v16.3
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}