name: Build APK and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.54.0'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: pip install flet requests beautifulsoup4 lxml

      - name: Build APK
        run: yes | flet build apk

      - name: Find APK
        id: find
        run: |
          APK=$(find build -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.apk }}
          tag_name: v2.1
          name: Tir Browser v2.1 - Android 16
          body: Версия с поддержкой Android 16 (Flutter 3.54.0)
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}