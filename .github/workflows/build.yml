name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Accept licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Install flet
        run: pip install flet==0.28.3 flet-webview==0.1.0 requests beautifulsoup4
      - name: Build APK
        run: flet build apk
      - name: Find APK
        id: find
        run: |
          APK=$(find build -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
      - name: Delete old releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({owner: context.repo.owner, repo: context.repo.repo});
            for (const r of releases.data) await github.rest.repos.deleteRelease({owner: context.repo.owner, repo: context.repo.repo, release_id: r.id});
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.apk }}
          tag_name: v17.7
          name: Tir Browser v17.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}