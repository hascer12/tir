name: Build APK and Create Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Install dependencies
        run: pip install flet requests beautifulsoup4 lxml

      - name: Build APK
        run: yes | flet build apk

      - name: Find APK
        id: find
        run: |
          APK=$(find build -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find.outputs.apk }}
          tag_name: v1.7
          name: Tir Browser v1.7
          body: Исправленная версия с правами
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}