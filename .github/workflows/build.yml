name: Build APK with Tkinter

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            patchelf build-essential gettext

      - name: Install buildozer
        run: |
          pip3 install --user --upgrade Cython==0.29.36 virtualenv
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Tir Browser
          package.name = tirbrowser
          package.domain = org.hascer12
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          source.exclude_dirs = .github,bin,build,.idea,__pycache__
          version = 14.5
          requirements = python3,sdl2,sdl2_ttf,sdl2_image,sdl2_mixer,openssl,sqlite3,requests,beautifulsoup4,lxml,urllib3,six,tkinter
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license = True
          private_requirements = main.py
          run_name = main.py

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          buildozer --verbose android debug
        timeout-minutes: 60

      - name: Find APK
        id: find
        run: |
          APK=$(find bin -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.apk }}
          tag_name: v14.5-tk
          name: Tir Browser v14.5 (Tkinter)
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
